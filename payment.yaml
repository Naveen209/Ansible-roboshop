- name: setup payment service
  hosts: payment
  connection: ssh
  become: yes

  tasks:
  - name: installing required packages
    ansible.builtin.yum:
      name: "{{item}}"
      state: present
    loop:
    - "python3.6"
    - "gcc"
    - "python3-devel"


  - name: check roboshop user exist or not
    ansible.builtin.command:
      cmd: id roboshop
    register: output
    ignore_errors: true
  - when: output.rc != 0
    name: creating user roboshop
    ansible.builtin.user:
      name: roboshop
      state: present


  - name: checking dir exist or not
    ansible.builtin.stat:
      path: /app
    register: output
 
  - when: output.stat.exists != true
    name: "Creating  /app"
    ansible.builtin.file:
      path: /app
      state: directory
  
  - name: Download application
    ansible.builtin.get_url:
      url: https://roboshop-builds.s3.amazonaws.com/payment.zip
      dest: /tmp/payment.zip

  - name: Unzip artifact
    ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    ansible.builtin.command:
      cmd: pip3.6 install -r requirements.txt 
      chdir: /app

  - name: Copy payment repo
    ansible.builtin.copy:
      src: payment.service
      dest: /etc/systemd/system/payment.service     
  
  - name: Daemon reload and start service
    ansible.builtin.systemd_service:
      name: payment
      daemon_reload: true
      enabled: yes
      state: started