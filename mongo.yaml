- name: setup mongodb
  hosts: localhost
  become: yes
  connection: local
  tasks:
    - name: Copy mongodb repo
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongodb-org-7.0.repo
    - name: Install mongodb
      ansible.builtin.yum:
        name: mongodb-org
        state: present
    - name: enable and start mongodb
      ansible.builtin.service:
        name: mongod
        state: started
        enabled: yes
    - name: Port binding using replace module
      ansible.builtin.replace:
        path: /etc/mongod.conf
        regexp: "127.0.0.1"
        replace: "0.0.0.0"
    - name: Restart mongodb service
      ansible.builtin.service:
        name: mongod
        state: restarted

  